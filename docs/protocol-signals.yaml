# CAN 协议 v4 —— 机器可读的信号数据库（单一来源）
# 规范性文字见 protocol.md；本文件是两端（STM32 C / Jetson C++）+ CI 共同的编码依据。
# 校验与测试向量生成：python3 tools/can_check.py
#
# *** FROZEN（2026-10-09 用户拍板；2026-10-28 按「双板架构恢复」修订一次）***
# 自本版起协议内容冻结：此后只做上位机侧功能开发，不再改帧/信号/ID/量化。
# 确需修订必须走提案流程：先改本 YAML → 两端同步实现 → tools/can_check.py 通过
# → PROTOCOL.md 同步 → 两 MCU 仓同批提交，缺一不可。
#
# 2026-10-28 修订（架构恢复双板：底盘板 + 机械臂板）：
#   1) ARM_CMD_A/B 与 SERVO_STATE_A/B 的**处理板**由底盘板改为机械臂板；
#      帧 ID 与字节布局一字未动（同总线 ID 全局唯一 → Jetson 侧零改动）。
#   2) 机械臂板新增两帧自己的上行：0x031 ARM_NODE_INFO、0x221 ARM_DIAG
#      （否则与底盘板的 0x030 / 0x220 同 ID 撞车）。
#   3) 协议版本号仍是 4（NODE_INFO.PROTO 不变）——为了不让 Jetson 侧握手判据失效 。
#      新增帧属**加法**，不破坏既有帧，Jetson 侧可以先不订阅。
#
# 2026-10-29 修订（三颗 IMU 全部启用，**纯加法**，仍是协议 4）：
#   1) 底盘板新增 0x032 CHASSIS_IMU（100 Hz，软 I2C 上限）：航向增量 + 倾角 + 事件位
#      （impact / slip / still / saturated），供 Jetson EKF 在 100 Hz 轮速帧之间补运动、
#      并用 slip 位给轮速降权。
#   2) 机械臂板新增 0x222 ARM_IMU（100 Hz）：偏航角速率 + 加速度模值 + 事件位。
#      **重要前提（2026-10-29 用户确认）**：三颗 IMU 全部装在**车体**上，机械臂板
#      并不在机械臂上。所以这颗不是“臂端 IMU”，而是同一刚体上的**第二颗**：
#         - 刚体上任意点角速度相同 → 它的 GZ 与底盘板 GZ **可逐样本互校**（冗余/故障判别）；
#         - 加速度受安装位置影响（α×r + ω²r），只用于模值/冲击，不做姿态。
#      机械臂碰撞确认靠“车静止 + 冲击尖峰 + 轮速为零”三者同时成立（车在动时分不清
#      是压到坑洼还是臂撞了限位，此帧只报 bump 事件，不参与任何控制判决）。
#   3) 两帧都是**事件/增量**，不是姿态本体：权威姿态仍在 Jetson 的 LSM6DSR。
#   4) 既有帧 ID / 字节布局 / 量化因子一字未动。
#
# 约定：
#   byte_order: little        -> Intel/小端（低字节在低地址）
#   layout:
#     raw8: DLC=8，byte0..7 = 信号（按顺序紧凑排列，总位宽必须 = 64 bit）。
#           无应用层 counter/CRC——传输完整性由 CAN 2.0 的 15 bit HW CRC + ACK + 自动重传保证。
#     e2e:  DLC=8，byte0..5 = 信号（48 bit），byte6 = [7:4] alive_counter | [3:0] flags，
#           byte7 = CRC8（覆盖 byte0..6，多项式 0x07，无反射，初值 = 本帧 data_id，无最终异或）。
#           仅用于其损坏会造成物理后果的安全帧（AUTOSAR E2E Profile 1 同构）。
#   每帧信号总位宽必须等于布局规定的位宽；不足者用 reserved 补齐，reserved 必须发 0。
version: 4
bus:
  bitrate: 1000000
  fd: false
  frame: CAN2.0A-11bit
  nodes:
    jetson:  上位机（rak / Orin Nano，can0 = mttcan，外置 SN65HVD230）
    chassis: vehical_rak_motion（C30D F407VET6，CAN1 = PD0 RX / PD1 TX，板载收发器）
    arm:     vehical_rak_arm（C30D F407VET6，同一块板，CAN1 = PD0 RX / PD1 TX，板载收发器）
  # 2026-10-28 起：三节点拓扑（Jetson / 底盘板 / 机械臂板），两板同挂一条 CAN 总线。
  # 架构：底盘板 = 4 轮闭环 + IMU；机械臂板 = 6 路舵机。
  # USB v2 串口路径保留为底盘板备用链路，帧格式不变。
  ground: 三个节点 GND 必须互联（差分总线共模参考）；总线两个物理端点各 120 Ω

units:
  rad_s:  {factor: 0.01, unit: rad/s}
  deg:    {factor: 0.1,  unit: deg}
  mrad:   {factor: 0.001, unit: rad}
  deg10:  {factor: 0.01, unit: deg}
  mg:     {factor: 1,    unit: mg}
  counts: {factor: 1,    unit: counts}
  mv:     {factor: 1,    unit: mV}

# 模式机（DIAG.MODE / STATE_u16 低两位同义）
mode_enum: {0: IDLE, 1: REMOTE, 2: ESTOP, 3: FAULT}

safety_cmd_code:           # SAFETY_CMD.CMD（byte0，低 4 位有效）
  1: START                 # IDLE/FAULT(已复位) -> REMOTE；前提 estop 已清
  2: STOP                  # 受控减速 -> IDLE（可 START 恢复）
  4: EMERGENCY_STOP        # 立即锁存急停，ISR 快速路径 <=40us 执行；可经 cmd=5 清除
  5: CLEAR_ESTOP           # 已实现（R50/R52）：ISR 置请求、1kHz 任务落地；
                           # 门 = 电池>=10500mV + 非 FAULT + 无快速停请求
                           # （PD3 使能开关门跳过——开关藏车内难达）
  6: CLEAR_FAULT           # 故障复位（仅当故障条件已消失）
  7: SOFT_RESET            # NVIC_SystemReset；急停锁存跨复位保持

state_bits:                # STATE_u16 位图（DIAG / NODE_INFO 上报）
  bit0: estop_latched      # 1 = 急停锁存中（CAN CLEAR_ESTOP 清除；物理按钮禁用，
                           # PE0 硬件故障——v4 冻结语义，CAN 全权急停）
  bit1: remote_running     # 1 = REMOTE 且电机使能
  bit2: fault_active       # 1 = FAULT
  bit3: cmd_stale          # 1 = DRIVE/ARM 指令断流（deadman 超时）
  bit4: bat_uv             # 1 = 电池欠压（< 10500 mV）
  bit5: can_recovering     # 1 = bus-off 自动恢复中
  # ---- bit6-10 驱动门自诊断位图（R58 并入，最近一次轮速命令入口的放行链快照）----
  bit6: dg_remote          # 1 = 远程门开（remote gate 在命令入口为开）
  bit7: dg_cal             # 1 = 轮标定已签核有效
  bit8: dg_imu             # 1 = IMU 样本新鲜（芯片在位且 <=20ms）
  bit9: dg_snapshot        # 1 = 编码器快照 4/4 有效且新鲜
  bit10: dg_stab           # 1 = 稳定补偿+定点换算完成（命令实际落地）
  bit11_15: reserved

imu_event_bits:            # CHASSIS_IMU.EVT_u8 / ARM_IMU.EVT_u8（2026-10-29 新增）
  bit0: impact             # 1 = 冲击（|a| 突变超阈）；机械臂板还表示“碰撞确认”
  bit1: slip               # 1 = 打滑/空转（仅底盘板：|陀螺偏航率 - 轮速偏航率| 超阈）
  bit2: still              # 1 = 静止（零偏自标定窗口成立）
  bit3: saturated          # 1 = 加速度/角速度接近满量程（可信度下降）
  bit4: stale              # 1 = 样本陈旧（>20 ms 无新样本）
  bit5_7: reserved

# deadman / 超时（ms）
timeout_ms:
  cmd_deadman: 100         # DRIVE_CMD / ARM_CMD 断流：轮速目标清零 / 舵机保持当前位
  host_node_lost: 200      # Jetson 判节点失联（DIAG 或 NODE_INFO 断流）：冻结输出 + STOP

messages:
  # ---- 安全 / 管理（ID < 0x100，保证抢总线优先级高于一切指令帧）----
  - id: 0x010
    name: SAFETY_CMD
    data_id: 0x01
    cycle_hz: 0            # 事件
    dir: jetson->broadcast
    layout: e2e
    signals: [SCMD_u16, RSVD16, RSVD16]

  - id: 0x020
    name: EMCY
    data_id: 0x02
    cycle_hz: 0            # 事件：10 ms 内首发，重发 3 次
    dir: chassis->broadcast
    layout: raw8
    signals: [FAULT_u16, AUX_u16, STATE_u16, RSVD16]

  - id: 0x030
    name: NODE_INFO
    data_id: 0x03
    cycle_hz: 1            # 上电 1 次 + 1 Hz
    dir: chassis->broadcast
    layout: raw8
    signals: [PROTO_u8, HWREV_u8, BUILD_u16, FAULT_u16, STATE_u16]

  - id: 0x031
    name: ARM_NODE_INFO
    data_id: 0x0D
    cycle_hz: 1            # 上电 1 次 + 1 Hz
    dir: arm->broadcast
    layout: raw8
    signals: [PROTO_u8, HWREV_u8, BUILD_u16, FAULT_u16, STATE_u16]

  # ---- 指令（jetson -> chassis）----
  - id: 0x100
    name: DRIVE_CMD
    data_id: 0x04
    cycle_hz: 100
    dir: jetson->chassis
    layout: raw8
    signals: [W1SPD_i16, W2SPD_i16, W3SPD_i16, W4SPD_i16]

  - id: 0x110
    name: ARM_CMD_A
    data_id: 0x05
    cycle_hz: 50
    dir: jetson->arm
    layout: raw8
    signals: [J1ANG_u16, J2ANG_u16, J3ANG_u16, J4ANG_u16]

  - id: 0x111
    name: ARM_CMD_B
    data_id: 0x06
    cycle_hz: 50
    dir: jetson->arm
    layout: raw8
    signals: [J5ANG_u16, J6ANG_u16, GRIP_u16, RSVD16]

  # ---- 遥测（chassis -> jetson）----
  - id: 0x200
    name: WHEEL_POS_A
    data_id: 0x07
    cycle_hz: 100
    dir: chassis->jetson
    layout: raw8
    signals: [W1POS_i32, W2POS_i32]

  - id: 0x201
    name: WHEEL_POS_B
    data_id: 0x08
    cycle_hz: 100
    dir: chassis->jetson
    layout: raw8
    signals: [W3POS_i32, W4POS_i32]

  - id: 0x202
    name: WHEEL_SPD
    data_id: 0x09
    cycle_hz: 100
    dir: chassis->jetson
    layout: raw8
    signals: [W1SPD_i16, W2SPD_i16, W3SPD_i16, W4SPD_i16]

  - id: 0x210
    name: SERVO_STATE_A
    data_id: 0x0A
    cycle_hz: 50
    dir: arm->jetson
    layout: raw8
    signals: [J1ANG_u16, J2ANG_u16, J3ANG_u16, J4ANG_u16]

  - id: 0x211
    name: SERVO_STATE_B
    data_id: 0x0B
    cycle_hz: 50
    dir: arm->jetson
    layout: raw8
    signals: [J5ANG_u16, J6ANG_u16, GRIP_u16, RSVD16]

  - id: 0x220
    name: DIAG
    data_id: 0x0C
    cycle_hz: 10
    dir: chassis->jetson
    layout: raw8
    signals: [BAT_u16, FAULT_u16, STATE_u16, MODE_u8, BUSOFFCNT_u8]

  - id: 0x221
    name: ARM_DIAG
    data_id: 0x0E
    cycle_hz: 10
    dir: arm->jetson
    layout: raw8
    signals: [FAULT_u16, STATE_u16, MODE_u8, SERVO_ERRCNT_u8, RSVD16]

  # ---- IMU 上行（2026-10-29 新增，纯加法）----
  # 定位：**不是姿态本体**，而是“增量 + 事件”。权威姿态仍在 Jetson 的 LSM6DSR。
  - id: 0x032
    name: CHASSIS_IMU
    data_id: 0x0F
    cycle_hz: 100          # 与轮速帧同频但**独立**（陀螺积分优于轮速差分）；
                           # 升到 200-400 Hz 需先换硬件 I2C2+DMA（P2，暂被 CubeMX 阻塞）
    dir: chassis->jetson
    layout: raw8
    signals: [DYAW_i16, PITCH_i16, ROLL_i16, EVT_u8, AGE_u8]

  - id: 0x222
    name: ARM_IMU
    data_id: 0x10
    cycle_hz: 100
    dir: arm->jetson
    layout: raw8
    signals: [GZ_i16, AMAG_u16, EVT_u8, AGE_u8, RSVD16]

# 信号字典：bit 长度 / 有无符号 / factor / min / max
signals:
  W1SPD_i16: {len: 16, signed: true,  factor: 0.01, min: -327.67, max: 327.67, desc: 轮1 目标/实测角速度 rad/s（前转正）}
  W2SPD_i16: {len: 16, signed: true,  factor: 0.01, min: -327.67, max: 327.67, desc: 轮2 角速度 rad/s}
  W3SPD_i16: {len: 16, signed: true,  factor: 0.01, min: -327.67, max: 327.67, desc: 轮3 角速度 rad/s}
  W4SPD_i16: {len: 16, signed: true,  factor: 0.01, min: -327.67, max: 327.67, desc: 轮4 角速度 rad/s}
  W1POS_i32: {len: 32, signed: true,  factor: 1,    min: -2147483648, max: 2147483647, desc: 轮1 累计位置（编码器计数，上电=0，里程计用）}
  W2POS_i32: {len: 32, signed: true,  factor: 1,    min: -2147483648, max: 2147483647, desc: 轮2 累计位置 counts}
  W3POS_i32: {len: 32, signed: true,  factor: 1,    min: -2147483648, max: 2147483647, desc: 轮3 累计位置 counts}
  W4POS_i32: {len: 32, signed: true,  factor: 1,    min: -2147483648, max: 2147483647, desc: 轮4 累计位置 counts}
  J1ANG_u16: {len: 16, signed: false, factor: 0.1,  min: 0, max: 2700, desc: 关节1 指令/实际角 deg（0.1°，0..270）}
  J2ANG_u16: {len: 16, signed: false, factor: 0.1,  min: 0, max: 2700, desc: 关节2 角 deg}
  J3ANG_u16: {len: 16, signed: false, factor: 0.1,  min: 0, max: 2700, desc: 关节3 角 deg}
  J4ANG_u16: {len: 16, signed: false, factor: 0.1,  min: 0, max: 2700, desc: 关节4 角 deg}
  J5ANG_u16: {len: 16, signed: false, factor: 0.1,  min: 0, max: 2700, desc: 关节5 角 deg}
  J6ANG_u16: {len: 16, signed: false, factor: 0.1,  min: 0, max: 2700, desc: 关节6 角 deg}
  GRIP_u16:  {len: 16, signed: false, factor: 0.1,  min: 0, max: 2700, desc: 夹爪开度 deg}
  BAT_u16:   {len: 16, signed: false, factor: 1,    min: 0, max: 65535, desc: 电池电压 mV}
  FAULT_u16: {len: 16, signed: false, factor: 1,    min: 0, max: 65535, desc: 故障码，0=无}
  AUX_u16:   {len: 16, signed: false, factor: 1,    min: 0, max: 65535, desc: 附加码（首个出错通道等）}
  STATE_u16: {len: 16, signed: false, factor: 1,    min: 0, max: 65535, desc: 状态位图（state_bits）}
  MODE_u8:   {len: 8,  signed: false, factor: 1,    min: 0, max: 3,     desc: 模式机（mode_enum）}
  BUSOFFCNT_u8: {len: 8, signed: false, factor: 1, min: 0, max: 255,  desc: bus-off 累计计数（饱和 255）}
  SERVO_ERRCNT_u8: {len: 8, signed: false, factor: 1, min: 0, max: 255, desc: 机械臂板：舵机指令异常计数（饱和 255）}
  PROTO_u8:  {len: 8,  signed: false, factor: 1,    min: 0, max: 255,  desc: 协议版本，本文档 = 4}
  HWREV_u8:  {len: 8,  signed: false, factor: 1,    min: 0, max: 255,  desc: 硬件版本}
  BUILD_u16: {len: 16, signed: false, factor: 1,    min: 0, max: 65535, desc: 固件构建标识（git short hash 折 16 位）}
  SCMD_u16:  {len: 16, signed: false, factor: 1,    min: 0, max: 65535, desc: SAFETY_CMD 命令码（低 4 位有效）}
  RSVD16:    {len: 16, signed: false, factor: 1,    min: 0, max: 0,    desc: 保 留，必须填 0}
  RSVD8:     {len: 8,  signed: false, factor: 1,    min: 0, max: 0,    desc: 保 留，必须填 0}
  DYAW_i16:  {len: 16, signed: true,  factor: 0.001, min: -32.767, max: 32.767, desc: 本帧区间内的偏航角增量 rad（底盘 IMU 陀螺 Z 积分）}
  PITCH_i16: {len: 16, signed: true,  factor: 0.01,  min: -327.67, max: 327.67, desc: 俯仰角 deg（加速度计重力方向解算，未融合）}
  ROLL_i16:  {len: 16, signed: true,  factor: 0.01,  min: -327.67, max: 327.67, desc: 横滚角 deg（同上）}
  GZ_i16:    {len: 16, signed: true,  factor: 0.01,  min: -327.67, max: 327.67, desc: 偏航角速率 deg/s（第二颗车体 IMU，与 0x032 同源刚体 → 可互校）}
  AMAG_u16:  {len: 16, signed: false, factor: 1,     min: 0, max: 65535, desc: 加速度模值 mg（含重力；静止≈1000，冲击时尖峰）}
  EVT_u8:    {len: 8,  signed: false, factor: 1,     min: 0, max: 255, desc: IMU 事件位图（imu_event_bits）}
  AGE_u8:    {len: 8,  signed: false, factor: 1,     min: 0, max: 255, desc: 样本龄 ms（饱和 255，用于判断新鲜度）}

# 一致性测试向量（两端都必须复现同样的字节）
vectors:
  - {msg: SAFETY_CMD,    name: V1, counter: 5,  flags: 0x0, values: {SCMD_u16: 4}, expect: 04 00 00 00 00 00 50 1D}
  - {msg: EMCY,          name: V2, values: {FAULT_u16: 0x30, AUX_u16: 1, STATE_u16: 0x0005}}
  - {msg: NODE_INFO,     name: V3, values: {PROTO_u8: 4, HWREV_u8: 1, BUILD_u16: 0xABCD, FAULT_u16: 0, STATE_u16: 0x0001}}
  - {msg: DRIVE_CMD,     name: V4, values: {W1SPD_i16: 500, W2SPD_i16: -200, W3SPD_i16: 500, W4SPD_i16: -200}}
  - {msg: ARM_CMD_A,     name: V5, values: {J1ANG_u16: 0, J2ANG_u16: 2250, J3ANG_u16: 2700, J4ANG_u16: 0}}
  - {msg: ARM_CMD_B,     name: V6, values: {J5ANG_u16: 0, J6ANG_u16: 0, GRIP_u16: 900}}
  - {msg: WHEEL_POS_A,   name: V7, values: {W1POS_i32: 100000, W2POS_i32: -50000}}
  - {msg: WHEEL_POS_B,   name: V8, values: {W3POS_i32: 123456789, W4POS_i32: -1}}
  - {msg: WHEEL_SPD,     name: V9, values: {W1SPD_i16: 120, W2SPD_i16: 120, W3SPD_i16: -80, W4SPD_i16: -80}}
  - {msg: SERVO_STATE_A, name: VA, values: {J1ANG_u16: 0, J2ANG_u16: 2250, J3ANG_u16: 2700, J4ANG_u16: 0}}
  - {msg: SERVO_STATE_B, name: VB, values: {J5ANG_u16: 0, J6ANG_u16: 0, GRIP_u16: 900}}
  - {msg: DIAG,          name: VC, values: {BAT_u16: 11100, FAULT_u16: 0, STATE_u16: 0x0003, MODE_u8: 1, BUSOFFCNT_u8: 0}}
  - {msg: ARM_NODE_INFO, name: VD, values: {PROTO_u8: 4, HWREV_u8: 1, BUILD_u16: 0x1234, FAULT_u16: 0, STATE_u16: 0x0000}}
  - {msg: ARM_DIAG,      name: VE, values: {FAULT_u16: 0, STATE_u16: 0x0003, MODE_u8: 1, SERVO_ERRCNT_u8: 0, RSVD16: 0}}
  - {msg: CHASSIS_IMU,   name: VF, values: {DYAW_i16: 123, PITCH_i16: -150, ROLL_i16: 250, EVT_u8: 0x03, AGE_u8: 4}}
  - {msg: ARM_IMU,       name: V10, values: {GZ_i16: -1234, AMAG_u16: 1450, EVT_u8: 0x01, AGE_u8: 9, RSVD16: 0}}
